# =====================================================================
# SOC-Lite · nginx interno del contenedor frontend
# Sirve la SPA con fallback de historial y cachea los assets hasheados.
# El proxy hacia la API lo hace el nginx perimetral (deploy/nginx.conf).
# =====================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Compresión (reduce el tamaño del bundle ~70 %)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/x-javascript image/svg+xml;

    # Cabeceras de seguridad (defensa en profundidad; el perímetro añade HSTS/CSP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets con hash en el nombre: caché inmutable de un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # El index.html NUNCA se cachea: garantiza recibir la versión nueva tras un despliegue
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # SPA: cualquier ruta desconocida se resuelve con el router de React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Salud del contenedor
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
