# =====================================================================
# SOC-Lite · Proxy inverso nginx (único punto expuesto a Internet)
# Termina TLS, aplica cabeceras de seguridad y enruta a los servicios.
# =====================================================================

upstream soc_backend {
    server backend:8000;
    keepalive 32;
}

upstream soc_frontend {
    server frontend:80;
    keepalive 16;
}

# Redirección permanente a HTTPS
server {
    listen 80;
    server_name _;

    # Dejar accesible el endpoint de ingesta para Wazuh interno por HTTP sólo
    # si el SIEM está en la misma red; en producción forzar HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name soc.org.local;

    # ------------------------------------------------------------------
    # TLS (ISO 27001 A.8.24 · NIST CSF PR.DS-02)
    # ------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ------------------------------------------------------------------
    # Cabeceras de seguridad
    # ------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;
    client_max_body_size 25m;

    # ------------------------------------------------------------------
    # API del backend
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://soc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # Límite de tasa para el endpoint de ingesta (protección anti-abuso)
        limit_req zone=ingest burst=50 nodelay;
    }

    # Webhook de ingesta con límite más estricto
    location = /api/v1/alerts/ingest {
        limit_req zone=ingest burst=100 nodelay;
        proxy_pass http://soc_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentación interactiva (bloquear en producción)
    location ~ ^/(docs|redoc|openapi.json) {
        # allow 10.0.0.0/8; deny all;   # descomentar en producción
        proxy_pass http://soc_backend;
        proxy_set_header Host $host;
    }

    # Métricas Prometheus: sólo red interna
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://soc_backend;
    }

    # ------------------------------------------------------------------
    # Consola de n8n (restringir a la red de administración)
    # ------------------------------------------------------------------
    location /n8n/ {
        # allow 10.10.0.0/16; deny all;   # descomentar en producción
        proxy_pass http://n8n:5678/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # Frontend SPA
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://soc_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
